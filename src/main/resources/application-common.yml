server:
  port: 80
  servlet:
    context-path: /
  tomcat:
    basedir: ./
  forward-headers-strategy: native

spring:
  config:
    activate:
      on-profile: common
  application:
    name: HEURON-CLOUD
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 1000
        format_sql: true
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
